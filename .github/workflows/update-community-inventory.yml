name: 更新投稿库存

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: community-inventory-update
  cancel-in-progress: false

jobs:
  update:
    if: startsWith(github.event.issue.title, '[库存投稿]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装图片处理依赖
        run: python -m pip install --disable-pip-version-check pillow

      - name: 读取 BGG 并生成库存
        env:
          BGG_API_TOKEN: ${{ secrets.BGG_API_TOKEN }}
          ISSUE_EVENT_PATH: ${{ github.event_path }}
        run: python scripts/process_inventory_issue.py

      - name: 提交库存变化
        id: commit
        run: |
          git add public/data/inventories.json public/data/inventories public/covers
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "更新 ${{ github.event.issue.user.login }} 的桌游库存"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 回复投稿结果
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
            gh issue comment "${{ github.event.issue.number }}" --body "库存已更新。GitHub Pages 通常会在几分钟内显示新内容。"
          else
            gh issue comment "${{ github.event.issue.number }}" --body "库存内容没有变化，现有数据已是最新。"
          fi
          gh issue close "${{ github.event.issue.number }}"

      - name: 回复失败原因
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --body "自动更新没有完成，请检查 BGG ID 的格式，或等待维护者查看本次运行记录。"
